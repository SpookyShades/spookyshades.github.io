      function getCountryDLC(country) {
        const wanted = normalize(country);

        const matches = Object.entries(DLC_GROUPS)
            .filter(([dlc, countries]) =>
                countries.some(
                    item => normalize(item) === wanted
                )
            )
            .map(([dlc]) => dlc)
            .sort((a, b) =>
                normalize(a).localeCompare(normalize(b))
            );

        return matches.length ? matches[0] : null;
    }

      function normalize(value) {
          return String(value)
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .trim();
      }

      function escapeHtml(value) {
          return String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#039;');
      }

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let value = '';
        let quoted = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const next = text[i + 1];

            if (char === '"' && quoted && next === '"') {
                value += '"';
                i++;
                continue;
            }

            if (char === '"') {
                quoted = !quoted;
                continue;
            }

            if (char === ',' && !quoted) {
                row.push(value.trim());
                value = '';
                continue;
            }

            if ((char === '\n' || char === '\r') && !quoted) {
                if (char === '\r' && next === '\n') i++;

                row.push(value.trim());

                if (row.some(cell => cell !== '')) {
                    rows.push(row);
                }

                row = [];
                value = '';
                continue;
            }

            value += char;
        }

        if (value || row.length) {
            row.push(value.trim());

            if (row.some(cell => cell !== '')) {
                rows.push(row);
            }
        }

        if (!rows.length) return [];

        const headers = rows[0].map(header =>
            header.toLowerCase().trim()
        );

        return rows.slice(1)
            .filter(row => {
                const firstCell = (row[0] || '').trim();

                // Ignore visual section headers within the CSV
                return !firstCell.startsWith('#');
            })
            .map(row => {
                const result = {};

                headers.forEach((header, i) => {
                    result[header] = (row[i] || '').trim();
                });

                return result;
            });
    }

      function getPagePath(path) {
          return '#/' + path.replace(/\.md$/i, '');
      }

      function getDLCInfo(title) {
          const info = [];

          Object.entries(DLC_GROUPS).forEach(([dlc, countries]) => {
              if (normalize(dlc) === normalize(title)) {
                  info.push({ dlc, countries });
              }
          });

          return info;
      }

      function loadPages() {
          return PAGE_MANIFEST.map(page => {
              const dlcInfo = getDLCInfo(page.title);

              return {
                  type: 'page',
                  title: page.title,
                  path: getPagePath(page.path),
                  game: page.game,
                  dlc: dlcInfo.length ? dlcInfo[0].dlc : null,
                  countries: dlcInfo.length ? dlcInfo[0].countries : []
              };
          });
      }

      async function loadCSVResults() {
        const response = await fetch('data.csv');

        if (!response.ok) {
            throw new Error('Could not load data.csv');
        }

        const rows = parseCSV(await response.text());

        return rows.map(row => {
            const country = row.state;
            const ets2DLC = getCountryDLC(country);

            let path;
            let game;
            let dlc = null;

            if (ets2DLC) {
                const page = PAGE_MANIFEST.find(
                    item =>
                        normalize(item.title) ===
                        normalize(ets2DLC)
                );

                if (page) {
                    path = getPagePath(page.path);
                    game = 'ETS2';
                    dlc = ets2DLC;
                }
            }

            if (!path) {
                path = '#/ats/' + normalize(country);
                game = 'ATS';
            }

            return {
                type: 'target',
                target: row.target,
                code: row.code,
                state: country,
                className: row.class,
                path: path,
                dlc: dlc,
                game: game,
                scrollTarget: 'Mileage Targets'
            };
        });
    }

      function addPageCountryResults(page, matches, query) {
        if (!page.dlc) return;

        page.countries.forEach(country => {
            const countryName = normalize(country);

            if (countryName === query) {
                matches.push({
                    ...page,
                    displayTitle:
                        country.toUpperCase() +
                        ' (' + page.dlc + ')',
                    subtitle:
                        page.game + ' • ' + page.dlc,
                    priority: 2,
                    resultType: 'country'
                });
            } else if (countryName.startsWith(query)) {
                matches.push({
                    ...page,
                    displayTitle:
                        country.toUpperCase() +
                        ' (' + page.dlc + ')',
                    subtitle:
                        page.game + ' • ' + page.dlc,
                    priority: 15,
                    resultType: 'country'
                });
            } else if (countryName.includes(query)) {
                matches.push({
                    ...page,
                    displayTitle:
                        country.toUpperCase() +
                        ' (' + page.dlc + ')',
                    subtitle:
                        page.game + ' • ' + page.dlc,
                    priority: 25,
                    resultType: 'country'
                });
            }
        });
    }

      function search(query) {
          const q = normalize(query);

          if (!q) return [];

          const matches = [];

          searchIndex.forEach(item => {
              if (item.type === 'page') {
                  const title = normalize(item.title);

                  if (title === q) {
                      matches.push({
                          ...item,
                          priority: 0,
                          resultType: 'page'
                      });
                  } else if (title.startsWith(q)) {
                      matches.push({
                          ...item,
                          priority: 20,
                          resultType: 'page'
                      });
                  } else if (title.includes(q)) {
                      matches.push({
                          ...item,
                          priority: 30,
                          resultType: 'page'
                      });
                  }

                  addPageCountryResults(item, matches, q);
                  return;
              }

              const target = normalize(item.target);
              const code = normalize(item.code);

              if (target === q || code === q) {
                  matches.push({
                      ...item,
                      priority: 10,
                      resultType: 'target'
                  });
              } else if (
                  target.startsWith(q) ||
                  code.startsWith(q)
              ) {
                  matches.push({
                      ...item,
                      priority: 15,
                      resultType: 'target'
                  });
              } else if (
                  target.includes(q) ||
                  code.includes(q)
              ) {
                  matches.push({
                      ...item,
                      priority: 40,
                      resultType: 'target'
                  });
              }
          });

          const unique = new Map();

          matches.forEach(item => {
              let key;

              if (item.resultType === 'target') {
                key =
                    'target:' +
                    item.path +
                    ':' +
                    normalize(item.target) +
                    ':' +
                    normalize(item.code) +
                    ':' +
                    normalize(item.state);
               } else if (
                  item.resultType === 'country'
              ) {
                  key =
                      'country:' +
                      normalize(item.displayTitle);
              } else {
                  key =
                      item.resultType +
                      ':' +
                      item.path +
                      ':' +
                      normalize(
                          item.displayTitle || item.title
                      );
              }

              if (!unique.has(key)) {
                  unique.set(key, item);
              }
          });

          return [...unique.values()]
              .sort((a, b) => {
                  if (a.priority !== b.priority) {
                      return a.priority - b.priority;
                  }

                  return (
                      a.target || a.title || ''
                  ).localeCompare(
                      b.target || b.title || ''
                  );
              })
              .slice(0, MAX_RESULTS);
      }

      function renderResults(query) {
          const results =
              document.getElementById('search-results');

          if (!results) return;

          if (!query.trim()) {
              results.innerHTML = '';
              results.classList.remove('visible');
              return;
          }

          if (!searchReady) {
              results.innerHTML =
                  '<div class="search-no-results">' +
                  'Search index is still loading...' +
                  '</div>';
              results.classList.add('visible');
              return;
          }

          const matches = search(query);

          if (!matches.length) {
              results.innerHTML =
                  '<div class="search-no-results">' +
                  'No matches found.' +
                  '</div>';

              results.classList.add('visible');
              return;
          }

          results.innerHTML = matches.map(item => {
              if (
                  item.resultType === 'page' ||
                  item.resultType === 'dlc' ||
                  item.resultType === 'country'
              ) {
                  return `
                      <a
                          class="search-result search-page-result"
                          href="${escapeHtml(item.path)}"
                      >
                          <div class="search-result-title">
                              ${escapeHtml(
                                  item.displayTitle ||
                                  item.title
                              )}
                          </div>
                          <div class="search-result-match">
                              ${escapeHtml(
                                  item.subtitle ||
                                  item.game + ' • Page'
                              )}
                          </div>
                      </a>
                  `;
              }

              return `
                <a
                    class="search-result search-target-result"
                    href="${escapeHtml(item.path)}"
                    data-scroll-target="Mileage Targets"
                >
                    <div class="search-result-title">
                        ${escapeHtml(item.target)}
                    </div>
                    <div class="search-result-match">
                        ${escapeHtml(item.code)}
                        • ${escapeHtml(item.state)}
                        • ${escapeHtml(item.className)}
                        ${item.dlc
                            ? ' • ' + escapeHtml(item.dlc)
                            : ''}
                    </div>
                </a>
            `;
          }).join('');

          results.classList.add('visible');
      }

      function scrollToMileageTargets() {
          const headings =
              document.querySelectorAll(
                  '.markdown-section h3'
              );

          for (const heading of headings) {
              if (
                  normalize(heading.textContent) ===
                  normalize('Mileage Targets')
              ) {
                  heading.scrollIntoView({
                      behavior: 'smooth',
                      block: 'start'
                  });

                  return true;
              }
          }

          return false;
      }

      function initializeSearch() {
          const input =
              document.getElementById('repo-search');

          const clear =
              document.getElementById('search-clear');

          const results =
              document.getElementById('search-results');

          if (!input || !clear || !results) {
              console.error(
                  'Search elements not found.'
              );
              return;
          }

          input.addEventListener('input', () => {
              const hasText =
                  input.value.trim().length > 0;

              clear.style.display =
                  hasText ? 'block' : 'none';

              renderResults(input.value);
          });

          clear.addEventListener('click', () => {
              input.value = '';
              clear.style.display = 'none';
              results.innerHTML = '';
              results.classList.remove('visible');
              input.focus();
          });

          input.addEventListener('keydown', event => {
              if (event.key === 'Escape') {
                  results.classList.remove('visible');
              }
          });

          results.addEventListener('click', event => {
              const result =
                  event.target.closest(
                      '.search-target-result'
                  );

              if (!result) return;

              const target =
                  result.dataset.scrollTarget;

              if (!target) return;

              sessionStorage.setItem(
                  'searchScrollTarget',
                  target
              );

              setTimeout(() => {
                  if (scrollToMileageTargets()) {
                      sessionStorage.removeItem(
                          'searchScrollTarget'
                      );
                  }
              }, 350);
          });

          document.addEventListener('click', event => {
              if (
                  !event.target.closest(
                      '.custom-search'
                  )
              ) {
                  results.classList.remove('visible');
              }
          });
      }

      async function buildSearchIndex() {
          try {
              const pages = loadPages();
              const csvResults =
                  await loadCSVResults();

              searchIndex = [
                  ...pages,
                  ...csvResults
              ];

              searchReady = true;

              console.log(
                  'Search index loaded:',
                  searchIndex.length,
                  'items'
              );
          } catch (error) {
              console.error(
                  'Search index failed:',
                  error
              );

              searchReady = false;

              const results =
                  document.getElementById(
                      'search-results'
                  );

              if (results) {
                  results.innerHTML =
                      '<div class="search-no-results">' +
                      'Search failed to load. ' +
                      'Check the browser console.' +
                      '</div>';
              }
          }
      }

      document.addEventListener(
          'DOMContentLoaded',
          () => {
              initializeSearch();
              buildSearchIndex();
          }
      );

      window.addEventListener(
          'load',
          () => {
              const target =
                  sessionStorage.getItem(
                      'searchScrollTarget'
                  );

              if (!target) return;

              let attempts = 0;

              const timer = setInterval(() => {
                  attempts++;

                  if (
                      scrollToMileageTargets() ||
                      attempts >= 20
                  ) {
                      clearInterval(timer);

                      if (attempts < 20) {
                          sessionStorage.removeItem(
                              'searchScrollTarget'
                          );
                      }
                  }
              }, 100);
          }
      );
  })();
  </script>

  <script>
  (function () {
      function updateCurrentNav() {
          const current = location.hash || '#/';
          const links = document.querySelectorAll('.nav-links a[href^="#/"]');

          links.forEach(link => {
              const href = link.getAttribute('href');
              const isCurrent = href === current;

              link.classList.toggle('current-page', isCurrent);

              if (isCurrent) {
                  link.setAttribute('aria-current', 'page');
              } else {
                  link.removeAttribute('aria-current');
              }
          });
      }

      window.addEventListener('hashchange', updateCurrentNav);
      document.addEventListener('DOMContentLoaded', updateCurrentNav);
  })();
  </script>

  <script>
  (function () {
    const mapHoverPlugin = function (hook, vm) {
      const typeLabels = { 'mileage': 'Mileage Target', 'map': 'Map', 'both': 'Mileage Target + Map' };

      hook.doneEach(function () {
        const containers = document.querySelectorAll('.map-container');
        containers.forEach(container => {
          const tooltip = container.querySelector('.map-tooltip'), states = container.querySelectorAll('.state');
          if (!tooltip || !states.length) return;

          states.forEach(state => {
            state.addEventListener('mouseenter', () => {
              const name = state.getAttribute('data-name'), rawType = state.getAttribute('data-type'), flagAttr = state.getAttribute('data-flags') || '';
              const flagCodes = flagAttr.split(/\s+/).filter(Boolean).sort();
              const count = flagCodes.length;

              // Balance flag layout
              const numCols = Math.ceil(count / 4);
              const numRows = Math.ceil(count / numCols);

              const flagsHtml = flagCodes.map(code => `<span class="flag flag-${code.toLowerCase()}"></span>`).join('');
              const friendlyType = typeLabels[rawType.toLowerCase()] || rawType;

              tooltip.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px;">
                  <div style="display: grid; grid-template-rows: repeat(${numRows}, auto); grid-auto-flow: column; gap: 4px; align-items: center;">
                    ${flagsHtml}
                  </div>
                  <div style="display:flex; flex-direction:column; justify-content:center;">
                    <div class="map-tooltip-title" style="margin:0; line-height:1.2; color:#D4AF37; font-weight:bold; font-family:'Orbitron', sans-serif; font-size:0.85rem; letter-spacing:0.5px;">${name.toUpperCase()}</div>
                    <div class="map-tooltip-type" style="margin:0; font-size:0.75rem; opacity:0.7; font-family:'Inter', sans-serif;">${friendlyType}</div>
                  </div>
                </div>
              `;
              tooltip.classList.add('visible');
            });

            state.addEventListener('mousemove', (e) => {
              const rect = container.getBoundingClientRect();
              const x = e.clientX - rect.left, y = e.clientY - rect.top;
              const tooltipWidth = tooltip.offsetWidth || 180;
              const posX = (x + tooltipWidth + 20 > rect.width) ? (x - tooltipWidth - 15) : (x + 15);
              tooltip.style.left = posX + 'px'; tooltip.style.top = (y + 15) + 'px';
            });

            state.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
          });
        });
      });
    };
    window.$docsify.plugins = [].concat(window.$docsify.plugins || [], mapHoverPlugin);
  }());
  </script>

  <!-- Mobile Sidebar -->
  <script>
  document.addEventListener("DOMContentLoaded", function () {

      if (window.innerWidth > 767) return;

      const button = document.createElement("button");
      button.id = "mobile-sidebar-toggle";
      button.setAttribute("aria-label", "Toggle navigation");
      button.setAttribute("aria-expanded", "false");

      button.innerHTML = `
          <span></span>
          <span></span>
          <span></span>
      `;

      const overlay = document.createElement("div");
      overlay.id = "mobile-sidebar-overlay";

      document.body.appendChild(overlay);
      document.body.appendChild(button);

      function openSidebar() {
          document.body.classList.add("mobile-sidebar-open");
          button.setAttribute("aria-expanded", "true");
      }

      function closeSidebar() {
          document.body.classList.remove("mobile-sidebar-open");
          button.setAttribute("aria-expanded", "false");
      }

      button.addEventListener("click", function () {
          if (document.body.classList.contains("mobile-sidebar-open")) {
              closeSidebar();
          } else {
              openSidebar();
          }
      });

      overlay.addEventListener("click", closeSidebar);

      /* Close the mobile sidebar after selecting a navigation link */
      document.addEventListener("click", function (e) {
          if (
              document.body.classList.contains("mobile-sidebar-open") &&
              e.target.closest(".sidebar a")
          ) {
              closeSidebar();
          }
      });

  });
  </script>

  <!-- Subpage dropdowns -->
    <script>
    (function () {
        function updatePageType() {
            const hash = window.location.hash || '';
            const isLandingPage = hash === '' || hash === '#' || hash === '#/';
            document.body.classList.toggle('landing-page', isLandingPage);
        }

        function makeMapSectionsCollapsible() {
            const content = document.querySelector('.markdown-section');
            if (!content || document.body.classList.contains('landing-page')) return;

            const mapsHeading = Array.from(content.querySelectorAll('h2')).find(
                h => h.textContent.trim().toLowerCase() === 'maps'
            );

            if (!mapsHeading) return;

            let current = mapsHeading.nextElementSibling;
            const mapH3s = [];

            while (current && current.tagName !== 'H2') {
                if (current.tagName === 'H3') mapH3s.push(current);
                current = current.nextElementSibling;
            }

            mapH3s.forEach(heading => {
                const details = document.createElement('details');
                details.className = 'subpage-section';

                const summary = document.createElement('summary');
                summary.textContent = heading.textContent;

                const sectionContent = document.createElement('div');
                sectionContent.className = 'subpage-section-content';

                let item = heading.nextElementSibling;

                while (item && item.tagName !== 'H3' && item.tagName !== 'H2') {
                    const next = item.nextElementSibling;
                    sectionContent.appendChild(item);
                    item = next;
                }

                details.appendChild(summary);
                details.appendChild(sectionContent);
                heading.replaceWith(details);
            });
        }

        function processPage() {
            updatePageType();
            setTimeout(makeMapSectionsCollapsible, 100);
        }

        document.addEventListener('DOMContentLoaded', processPage);
        window.addEventListener('hashchange', processPage);
    })();
    </script>
